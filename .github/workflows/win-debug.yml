name: win-debug
on:
  push:
    branches: [ci-debug-3]
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: unit tests
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set +e
          for p in photocraft; do
            cargo test -p $p --lib --bins --no-fail-fast --message-format=short --color=never > out-$p.txt 2>&1
            echo "::notice::$p exit $?"
            grep -E "^test .* FAILED|panicked at|test result|error|warning: unused" out-$p.txt | head -40 | while IFS= read -r l; do echo "::error::$p: $l"; done
            grep -A4 "panicked at" out-$p.txt | grep -v "^--" | head -40 | while IFS= read -r l; do echo "::warning::$p: $l"; done
          done
          exit 0
